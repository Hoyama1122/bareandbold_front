name: Deploy Frontend to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploying via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            # 1. ย้ายไปยังโฟลเดอร์ Frontend และดึงโค้ดเวอร์ชันล่าสุด
            cd /var/www/bareandbold/bareandbold_front
            git pull

            # 2. ย้ายมาโฟลเดอร์หลักเพื่อ Build และรันตู้คอนเทนเนอร์ตัวใหม่
            cd /var/www/bareandbold
            docker compose up -d --build frontend

      - name: Send Discord Notification (Success)
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
          -d '{"embeds": [{"title": "🚀 Frontend Storefront Deployment Success!", "description": "The frontend storefront has been successfully updated and deployed on VPS.", "color": 3066993, "fields": [{"name": "Commit Message", "value": "${{ github.event.head_commit.message }}"}, {"name": "Author", "value": "${{ github.event.head_commit.author.name }}"}]}]}' \
          ${{ secrets.DISCORD_WEBHOOK }}

      - name: Send Discord Notification (Failure)
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
          -d '{"embeds": [{"title": "❌ Frontend Storefront Deployment Failed!", "description": "Frontend storefront deployment failed on VPS. Please inspect GitHub Actions logs.", "color": 15158332, "fields": [{"name": "Commit Message", "value": "${{ github.event.head_commit.message }}"}]}]}' \
          ${{ secrets.DISCORD_WEBHOOK }}
